name: Build DOOV R17 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DOOV_R17_Alcatel_sunset_source.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q DOOV_R17_Alcatel_sunset_source.zip -d source

      - name: Build debug APK
        working-directory: source/DOOV_R17_Launcher
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DOOV-R17-Alcatel-debug
          path: source/DOOV_R17_Launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
